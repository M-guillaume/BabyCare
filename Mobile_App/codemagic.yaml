workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.41.7
      vars:
        BUNDLE_ID: "com.example.babycare"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --simulator
    artifacts:
      - build/ios/iphonesimulator/Runner.app

  android-workflow:
    name: Android Build
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: 3.41.7
      vars:
        BUNDLE_ID: "com.example.babycare"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/apk/release/**/*.apk
